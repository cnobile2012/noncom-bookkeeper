[meta]
version = "2.0.0"
title = "Bahá'í Bookkeeper"
panels = [['Organization Info', 'organization', false],
          ['Budget', 'budget', true],
          ['Monthly', 'monthly', false],
          ['Choose Fiscal Year', 'fiscal', false]]
locale_prefix = {lsa = "The Spiritual Assembly of the Bahá'ís of ", group = "Bahá'í group of "}
font_16_bold = [16, 'FONTFAMILY_DEFAULT', 'FONTSTYLE_NORMAL',
                'FONTWEIGHT_BOLD', 0, '']
font_14_bold = [14, 'FONTFAMILY_DEFAULT', 'FONTSTYLE_NORMAL',
                'FONTWEIGHT_BOLD', 0, '']
font_12_normal = [12, 'FONTFAMILY_DEFAULT', 'FONTSTYLE_NORMAL',
                  'FONTWEIGHT_NORMAL', 0, '']
font_12_bold = [12, 'FONTFAMILY_DEFAULT', 'FONTSTYLE_NORMAL',
                'FONTWEIGHT_BOLD', 0, '']
font_10_normal = [10, 'FONTFAMILY_DEFAULT', 'FONTSTYLE_NORMAL',
                  'FONTWEIGHT_NORMAL', 0, '']
font_10_bold = [10, 'FONTFAMILY_DEFAULT', 'FONTSTYLE_NORMAL',
                'FONTWEIGHT_BOLD', 0, '']
data_entry_titles = [  # Title, num_cb, num_txt, cb_pos, span, btn
    ['Transaction Type', 4, 0, 'top', 2, true],
    ['Entry Reference', 4, 1, 'top', 2, true],
    ['Cash in Bank', 2, 2, 'top', 2, true],
    ['Cash on Hand', 2, 2, 'top', 2, true],
    ['Income', 3, 2, 'top', 2, true],
    ['Expenses', 0, 0, '', 2, false],
    ["Local Bahá'í Expenses", 0, 5, 'bottom', 1, false],
    ["National Bahá'í Funds", 0, 11, 'bottom', 1, false],
    ['Continental and International Funds', 0, 11, 'bottom', 1, false],
    ['Regional Funds', 0, 3, 'bottom', 1, false],
    ['Area Funds', 0, 1, 'bottom', 1, false],
    ]
data_entry_labels = [
    ['transaction', 'Contribution:', 'Distribution:', 'Expense:', 'Other:'],
    ['$reference', 'OCS:', 'Check:', 'Receipt:', 'Deposit:', 'Number:'],
    ['$bank', 'Deposit:', 'Withdrawal:', '@Amount:', '%Balance:'],
    ['$coh', 'Replenishment:', 'Disbursement:', '@Amount:', '%Balance:'],
    ['$income', 'Local Fund:', 'Contributed Expense:', 'Other:', '@Amount:',
     '%Balance:']
    ]

